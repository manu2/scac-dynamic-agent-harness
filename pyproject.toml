[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scac-dynamic-agent-harness"
version = "0.1.0"
description = "Deterministic harness for dynamic execution-telemetry agent evaluation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
